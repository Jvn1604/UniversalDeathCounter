# Tests and builds the macOS and Linux apps. Pushing a v* tag (the same
# tag that builds the Windows release) adds the .dmg and the AppImage to
# that GitHub Release.
#
# macOS: an Apple Silicon .app in a .dmg. It isn't notarized (that needs a
# paid Apple developer account), so the first launch is right-click → Open.
# Linux: one AppImage, built on the oldest supported Ubuntu so it runs on
# older distributions too.

name: Build macOS and Linux

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Qt, an X server, xdotool)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libdbus-1-3 libfuse2 xvfb xdotool

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (with a virtual X server)
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -m pytest -q

      - name: Read app version
        id: version
        run: |
          version=$(python -c "from src.utils.constants import APP_VERSION; print(APP_VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} does not match APP_VERSION $version" >&2
            exit 1
          fi

      - name: Build app folder
        run: pyinstaller --noconfirm packaging/UniversalDeathCounter.spec

      - name: Build AppImage
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
          bash packaging/make_appimage.sh "${{ steps.version.outputs.version }}"

      - name: Smoke test (the app starts under X11)
        run: |
          app="dist/UniversalDeathCounter/UniversalDeathCounter"
          timeout 15 xvfb-run -a "$app" || code=$?
          # 124 = still running when timeout stopped it, which is what we want.
          if [ "${code:-0}" != "124" ]; then echo "The app exited early ($code)"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: UniversalDeathCounter-linux
          path: dist/UniversalDeathCounter-${{ steps.version.outputs.version }}-x86_64.AppImage

      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/UniversalDeathCounter-${{ steps.version.outputs.version }}-x86_64.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Read app version
        id: version
        run: |
          version=$(python -c "from src.utils.constants import APP_VERSION; print(APP_VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: pyinstaller --noconfirm packaging/UniversalDeathCounter.spec

      - name: Smoke test (the app starts)
        run: |
          app="dist/UniversalDeathCounter.app/Contents/MacOS/UniversalDeathCounter"
          "$app" & pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then echo "The app exited early"; exit 1; fi
          kill "$pid"

      - name: Build .dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/UniversalDeathCounter.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "DUDC" -srcfolder dist/dmg -ov -format UDZO \
            "dist/UniversalDeathCounter-${{ steps.version.outputs.version }}-macOS.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: UniversalDeathCounter-macos
          path: dist/UniversalDeathCounter-${{ steps.version.outputs.version }}-macOS.dmg

      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/UniversalDeathCounter-${{ steps.version.outputs.version }}-macOS.dmg
