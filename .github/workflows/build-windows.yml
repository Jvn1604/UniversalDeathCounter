# Tests, builds the standalone .exe and the Inno Setup installer on Windows.
# Pushing a v* tag (e.g. v1.6.0) also publishes a GitHub Release with the
# installer attached, which the in-app update checker reads.

name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm packaging/UniversalDeathCounter.spec

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDeathCounter-exe
          path: dist/UniversalDeathCounter.exe

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDeathCounter-Setup
          path: dist_installer/UniversalDeathCounterSetup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/UniversalDeathCounterSetup.exe
            dist/UniversalDeathCounter.exe
          generate_release_notes: true
